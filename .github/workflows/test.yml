name: "Test"

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-tags: true

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "${{ matrix.java }}"
          cache: "maven"

      - name: Tune kernel limits for Scylla
        run: |
          sudo sysctl -w fs.aio-max-nr=30000000
          sudo sysctl -w fs.file-max=30000000

      - name: Run Tests
        run: |
          ulimit -n 65536
          mvn -B test \
            -Dproject.build.sourceEncoding=UTF-8 \
            -DskipTests=false \
            -pl dynamodb,scylla -am

  packaging:
    name: Build Package (Java ${{ matrix.java }})
    needs: [test]
    strategy:
      fail-fast: true
      matrix:
        java: ["21"]
    uses: "./.github/workflows/build.yml"
    with:
      version: "0.0.0-test"
      java: "${{ matrix.java }}"
