name: "Build Docker Image"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Version tag for the Docker image"
        type: string
      java_version:
        default: "21"
        required: false
        description: "Java version to use for building"
        type: string
      docker_target:
        default: production
        required: false
        description: "Docker build target stage"
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        required: false
        description: "Target platforms for multi-arch build"
        type: string
      image:
        default: "scylladb/ycsb"
        required: false
        description: "Docker image name"
        type: string

  workflow_call:
    inputs:
      version:
        required: true
        description: "Version tag for the Docker image"
        type: string
      java_version:
        default: "21"
        required: false
        description: "Java version to use for building"
        type: string
      docker_target:
        default: production
        required: false
        description: "Docker build target stage"
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        required: false
        description: "Target platforms for multi-arch build"
        type: string
      image:
        default: "scylladb/ycsb"
        required: false
        description: "Docker image name"
        type: string
    secrets:
      REGISTRY:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      BUILDX_GIT_INFO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }}
            type=sha,prefix=

      - name: Build and Push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          platforms: ${{ inputs.platforms }}
          target: ${{ inputs.docker_target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ inputs.image }}:latest
            ${{ inputs.image }}:${{ inputs.version }}
          build-args: |
            INPUT_JAVA_VERSION=${{ inputs.java_version }}
            VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=ScyllaDB YCSB
            org.opencontainers.image.description=YCSB benchmark tool for ScyllaDB
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
