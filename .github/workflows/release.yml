name: "Release"

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  tag:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Get Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: olegtarasov/get-tag@9a8716825750e73195b02db42777b92ffe960605 # v2.1.4
        id: version_tag
        with:
          tagRegex: "v(.*)"

  test:
    name: Run Tests
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Tune kernel limits for Scylla
        run: |
          sudo sysctl -w fs.aio-max-nr=30000000
          sudo sysctl -w fs.file-max=30000000

      - name: Run Tests
        run: |
          ulimit -n 65536
          mvn -B test \
            -Dproject.build.sourceEncoding=UTF-8 \
            -DskipTests=false \
            -pl dynamodb,scylla -am

  build:
    name: Build Release
    needs: [tag, test]
    strategy:
      matrix:
        java: ["21"]
    uses: "./.github/workflows/build.yml"
    with:
      version: "${{ needs.tag.outputs.version }}"
      java: "${{ matrix.java }}"

  docker:
    name: Build Docker Image
    needs: [tag, test]
    uses: "./.github/workflows/docker.yml"
    with:
      version: "${{ needs.tag.outputs.version }}"
      java_version: "21"
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      REGISTRY: ${{ secrets.REGISTRY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  release:
    name: Create GitHub Release
    needs: [tag, docker, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ycsb-java21

      - name: List Artifacts
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        id: release
        with:
          make_latest: true
          name: "v${{ needs.tag.outputs.version }}"
          tag_name: "v${{ needs.tag.outputs.version }}"
          generate_release_notes: true
          append_body: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            scylla-ycsb-${{ needs.tag.outputs.version }}-java21.tar.gz
            scylla-ycsb-${{ needs.tag.outputs.version }}-java21.tar.gz.sha256

      - name: Generate Changelog
        uses: heinrichreimer/action-github-changelog-generator@e60b5a2bd9fcd88dadf6345ff8327863fb8b490f # v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: true
          releaseUrl: ${{ steps.release.outputs.url }}
          issues: false
          pullRequests: true
